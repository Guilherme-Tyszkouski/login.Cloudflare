name: Revisão por IA

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install -g @github/copilot

      - name: Monta o prompt
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o diff abaixo e responda em português, em até 10 itens, apontando:"
            echo "- segredos expostos (tokens, Client Secret, API keys);"
            echo "- SQL montado por concatenação de strings em vez de prepare().bind();"
            echo "- erros de lógica."
            echo "Cite o arquivo e a linha de cada ponto."
            echo
            echo '```diff'
            git diff "origin/$BASE_REF...HEAD" | head -c 20000
            echo
            echo '```'
          } > prompt.txt

      - name: Revisa com IA
        id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código experiente. Responda sempre em português do Brasil, em Markdown.

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file "${{ steps.ia.outputs.response-file }}"
