name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Procura segredos versionados
        run: |
          if git grep -nE "GOCSPX[-]|client[_]secret *= *['\"][^'\"]+" -- . ':!*.md'; then
            echo "::error::Possível segredo versionado encontrado."
            exit 1
          fi

      - name: Aplica as migrações num SQLite local
        run: |
          rm -f teste.db
          for f in migrations/*.sql; do
            echo "Aplicando $f"
            sqlite3 teste.db < "$f"
          done

      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"
